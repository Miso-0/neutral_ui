name: neutral_ui_example
description: A copyable component library for NeutralUI headless Flutter controls.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  neutral_ui:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/decoration_pattern.png
    - lib/examples/buttons/
    - lib/examples/toggles/
    - lib/examples/lists/
    - lib/examples/sliders/
    - lib/examples/menus/
    - lib/examples/input/
    - lib/examples/pickers/
    - lib/examples/feedback/
    - lib/examples/chips/
    - lib/examples/navigation/
    - lib/examples/tables/
    - lib/examples/foundations/
    - assets/fonts/OFL.txt
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
